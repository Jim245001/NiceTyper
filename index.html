<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EBE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>打點脆文ㄅ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   稿紙 · 校對台   —   手機優先重寫版

   ⚠️ 游標修正的核心規則（請勿在 #composer 的任何祖先加上）：
      overflow:hidden + border-radius / -webkit-overflow-scrolling
      / transform / filter / position:sticky / animation
      以上都會讓 iOS WebView 把游標畫到別的圖層而看不見。
      #composer 的祖先鏈刻意保持扁平乾淨。
   ============================================================ */
:root{
  --paper:#E9EBE3;
  --card:#FFFFFF;
  --sheet:#F6F7F2;
  --ink:#1C1E1B;
  --ink-2:#4A5049;
  --ink-3:#878D82;
  --rule:#D3D7CA;
  --rule-2:#E6E9DE;
  --grid:#3F6B57;
  --seal:#A8412F;

  /* 19 全形字 × 16px = 304px。用 16px 是為了讓 iOS 不要自動放大頁面 */
  --fs:16px;
  --col:304px;

  --f-display:"Noto Serif TC","Songti TC","Source Han Serif TC","MingLiU",serif;
  --f-body:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",-apple-system,BlinkMacSystemFont,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --dock-h:64px;
  --safe-b:env(safe-area-inset-bottom, 0px);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }

body{
  margin:0;
  padding:0 8px calc(var(--dock-h) + var(--safe-b) + 24px);
  font-family:var(--f-body);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(rgba(63,107,87,.13) 1px, transparent 1px),
    linear-gradient(90deg, rgba(63,107,87,.13) 1px, transparent 1px);
  background-size:24px 24px;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}

.page{ max-width:360px; margin:0 auto; }

::selection{ background:rgba(168,65,47,.14); }
:focus-visible{ outline:2px solid var(--grid); outline-offset:2px; }

/* ============================================================
   刊頭
   ============================================================ */
.head{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px;
  padding:16px 4px 12px;
}
.head-title{
  font-family:var(--f-display);
  font-weight:700; font-size:21px;
  letter-spacing:.06em;
  margin:0;
}
.head-sub{
  font-family:var(--f-mono);
  font-size:9.5px; letter-spacing:.18em;
  color:var(--grid);
  text-transform:uppercase;
  margin:3px 0 0;
}
.seal{
  flex-shrink:0;
  width:34px; height:34px;
  background:var(--seal);
  border-radius:3px;
  display:grid; place-items:center;
  font-family:var(--f-display);
  font-weight:700; font-size:17px; color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
}

/* ============================================================
   編輯卡（= 預覽本身）
   祖先鏈保持乾淨：無 overflow、無圓角裁切、無陰影、無動畫
   ============================================================ */
.composer-card{
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:14px;
  padding:14px 12px 10px;
}

/* 字尺：每格 1 字，第 5/10/15 格加高，右端朱紅線 = 第 19 字 */
.ruler-row{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}
.ruler{
  width:100%;
  max-width:var(--col);
  height:9px;
  border-right:1px solid var(--seal);
  background-repeat:no-repeat;
  background-position:left bottom, left bottom;
  background-size:100% 8px, 100% 5px;
  background-image:
    repeating-linear-gradient(to right, var(--ink-3) 0 1px, transparent 1px 80px),
    repeating-linear-gradient(to right, var(--rule) 0 1px, transparent 1px 16px);
}
.ruler-cap{
  font-family:var(--f-mono);
  font-size:9px; letter-spacing:.1em;
  color:var(--seal);
  white-space:nowrap;
  line-height:1;
  padding-bottom:1px;
}

.who{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
.avatar{
  width:32px; height:32px; border-radius:50%;
  object-fit:cover; background:#EEE;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
  flex-shrink:0;
}
.who-name{ font-size:14.5px; font-weight:600; }
.who-time{ font-size:13px; color:#999; margin-left:auto; }

#composer{
  display:block;
  width:100%;
  max-width:var(--col);
  min-height:calc(var(--fs) * 1.5 * 3);
  border:0; outline:0; resize:none;
  padding:0; margin:0;
  background:transparent;
  color:#000;
  caret-color:#000;              /* 明確指定，避免被繼承成透明 */
  font-family:var(--f-body);
  font-size:var(--fs);           /* 16px：iOS 聚焦時不會放大頁面 */
  line-height:1.5;
  letter-spacing:0;
  white-space:pre-wrap;
  word-break:normal;
  overflow-wrap:anywhere;        /* 中文任意斷行、英文單字不硬切 */
  overflow:hidden;               /* 只加在輸入框自己身上，祖先不能加 */
}
#composer::placeholder{ color:#9A9A9A; }

.media{
  display:grid; gap:4px;
  grid-template-columns:repeat(auto-fill, minmax(72px,1fr));
  max-width:var(--col);
  margin-top:10px;
}
.media:empty{ display:none; }
.media-item{ position:relative; aspect-ratio:1/1; }
.media-item img{
  width:100%; height:100%;
  object-fit:cover; border-radius:9px;
  display:block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);
}
.media-x{
  position:absolute; top:4px; right:4px;
  width:26px; height:26px;
  border:0; padding:0; margin:0;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:#fff; font-size:16px; line-height:1;
  display:grid; place-items:center;
  cursor:pointer;
}

.acts{ display:flex; gap:18px; margin:12px 0 2px; color:#111; }
.acts svg{ display:block; }

/* ============================================================
   量測卡
   ============================================================ */
.card{
  background:var(--sheet);
  border:1px solid var(--rule);
  border-radius:14px;
  padding:16px 14px;
  margin-top:12px;
}
.card-head{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:10px; margin-bottom:14px;
}
.card-title{
  font-family:var(--f-display);
  font-weight:700; font-size:14px; letter-spacing:.14em;
  margin:0;
}
.card-note{
  font-family:var(--f-mono);
  font-size:9px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3);
}

.stats{ display:flex; gap:8px; }
.stat{
  flex:1;
  background:var(--card);
  border:1px solid var(--rule-2);
  border-radius:8px;
  padding:10px;
  text-align:center;
}
.stat-k{ font-size:10.5px; color:var(--ink-3); letter-spacing:.08em; margin-bottom:4px; }
.stat-v{
  font-family:var(--f-mono);
  font-size:18px; font-weight:500; line-height:1;
  font-variant-numeric:tabular-nums;
}
.stat-v.hot{ color:var(--seal); }

.tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:12px; }
.tags:empty{ display:none; }
.tag{
  font-family:var(--f-mono);
  font-size:11.5px;
  color:var(--grid);
  background:rgba(63,107,87,.1);
  border-radius:99px;
  padding:4px 10px;
}

/* --- 行寬圖 --- */
.map-wrap{ position:relative; }
.map{ position:relative; }
.map-limit{
  position:absolute; top:0; bottom:0;
  left:calc(26px + (100% - 26px) * .9047);   /* 19 / 21 */
  width:1px; background:var(--seal); opacity:.5;
  pointer-events:none;
}
.row{
  display:flex; align-items:center; gap:8px;
  height:22px;                 /* 觸控目標夠大 */
  border:0; padding:0; margin:0;
  background:none;
  width:100%;
  cursor:pointer;
  font:inherit;
  text-align:left;
}
.row:active .bar{ opacity:.55; }
.row-n{
  font-family:var(--f-mono); font-size:9.5px;
  color:var(--ink-3); width:18px; text-align:right;
  font-variant-numeric:tabular-nums; flex-shrink:0;
}
.track{ flex:1; height:6px; position:relative; }
.bar{
  position:absolute; left:0; top:0; height:100%;
  background:var(--grid); border-radius:99px; min-width:3px;
}
.bar.over{ background:var(--seal); }
.bar.blank{
  background:none; height:0; top:3px;
  border-top:1px dashed var(--rule);
  width:22px !important; min-width:0; border-radius:0;
}
.map-empty{ font-size:12.5px; color:var(--ink-3); line-height:1.7; margin:0; }
.map-legend{
  margin-top:12px; font-size:11px; color:var(--ink-3);
  display:none; align-items:center; gap:7px; line-height:1.5;
}
.map-legend.on{ display:flex; }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--seal); flex-shrink:0; }

/* --- 選項 --- */
.opt{ display:flex; gap:11px; align-items:flex-start; padding:4px 0; }
.opt input{
  appearance:none; -webkit-appearance:none;
  width:20px; height:20px; flex-shrink:0; margin:0;
  border:1px solid var(--rule); border-radius:5px;
  background:var(--card);
}
.opt input:checked{
  background-color:var(--grid); border-color:var(--grid);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2.5 6.2l2.4 2.4 4.6-5' fill='none' stroke='white' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-size:14px; background-position:center; background-repeat:no-repeat;
}
.opt-t{ font-size:12.5px; line-height:1.6; color:var(--ink-2); }
.opt-t b{ display:block; font-size:13.5px; color:var(--ink); margin-bottom:2px; }

.link-btn{
  width:100%;
  background:none; border:0;
  border-top:1px solid var(--rule-2);
  margin-top:14px; padding:14px 0 2px;
  font-family:var(--f-body); font-size:13.5px;
  color:var(--ink-3);
  cursor:pointer;
}

.foot{
  text-align:center;
  font-family:var(--f-mono);
  font-size:9.5px; letter-spacing:.14em;
  color:var(--ink-3);
  padding:22px 0 4px;
}

/* ============================================================
   底部工具列（拇指區）
   不是 #composer 的祖先，可以安全使用 fixed
   ============================================================ */
.dock{
  position:fixed;
  left:0; right:0; bottom:0;
  height:calc(var(--dock-h) + var(--safe-b));
  padding:0 12px var(--safe-b);
  display:flex; align-items:center; gap:10px;
  background:rgba(233,235,227,.94);
  border-top:1px solid var(--rule);
}
.dock-count{
  font-family:var(--f-mono);
  font-size:13px; font-variant-numeric:tabular-nums;
  color:var(--ink-2);
  min-width:74px;
}
.dock-count b{ font-size:16px; font-weight:600; color:var(--ink); }
.dock-count.over b, .dock-count.over{ color:var(--seal); }

.icon-btn{
  width:44px; height:44px; flex-shrink:0;
  border:1px solid var(--rule); border-radius:10px;
  background:var(--card);
  display:grid; place-items:center;
  cursor:pointer; padding:0;
}
.dock-copy{
  flex:1; height:44px;
  border:0; border-radius:10px;
  background:var(--ink); color:#fff;
  font-family:var(--f-body); font-size:15px; font-weight:600;
  letter-spacing:.05em;
  cursor:pointer;
}
.dock-copy:active{ opacity:.82; }

/* ============================================================
   通知
   ============================================================ */
.toast{
  position:fixed; left:12px; right:12px;
  bottom:calc(var(--dock-h) + var(--safe-b) + 12px);
  display:flex; align-items:center; gap:12px;
  background:var(--ink); color:#fff;
  padding:12px 12px 12px 16px;
  border-radius:12px;
  font-size:13.5px;
  opacity:0; pointer-events:none;
  transition:opacity .18s ease;
  z-index:50;
}
.toast.on{ opacity:1; pointer-events:auto; }
.toast-txt{ flex:1; }
.toast-undo{
  border:0; border-radius:8px;
  background:rgba(255,255,255,.16); color:#fff;
  font-family:var(--f-body); font-size:13px; font-weight:600;
  padding:8px 14px; cursor:pointer;
  display:none;
}
.toast-undo.on{ display:block; }

.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

@media (min-width:420px){
  .page{ max-width:380px; }
}
@media (prefers-reduced-motion:reduce){
  *{ transition-duration:.001ms !important; }
}
</style>
</head>

<body>

<div class="page">

  <header class="head">
    <div>
      <h1 class="head-title">打點脆文ㄅ</h1>
      <p class="head-sub">19 全形字 · 逐行校對</p>
    </div>
    <div class="seal" aria-hidden="true">校</div>
  </header>

  <!-- ===== 編輯卡（同時就是預覽） ===== -->
  <main class="composer-card">

    <div class="ruler-row">
      <div class="ruler" aria-hidden="true"></div>
      <span class="ruler-cap">19 字換行</span>
    </div>

    <div class="who">
      <img id="avatar" class="avatar" src="head_icon.jpg" alt="你的頭貼">
      <span class="who-name">you</span>
      <span class="who-time">剛剛</span>
    </div>

    <label for="composer" class="sr">貼文內容</label>
    <textarea id="composer"
              placeholder="有什麼新鮮事？"
              rows="3"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="enter"></textarea>

    <div id="media" class="media"></div>

    <div class="acts" aria-hidden="true">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.6c0 4.9-8.8 10.2-8.8 10.2S3.2 13.5 3.2 8.6a4.6 4.6 0 018.8-1.8 4.6 4.6 0 018.8 1.8z"/></svg>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.6a8.1 8.1 0 01-11.3 7.4L3.5 20.5l1.5-5.6a8.1 8.1 0 1115.5-3.3z"/></svg>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5l4 4-4 4"/><path d="M3 12.5v-2a4 4 0 014-4h14"/><path d="M7 21.5l-4-4 4-4"/><path d="M21 11.5v2a4 4 0 01-4 4H3"/></svg>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2.5L11 13"/><path d="M21.5 2.5l-6.7 19-3.8-8.5-8.5-3.8 19-6.7z"/></svg>
    </div>
  </main>

  <!-- ===== 量測 ===== -->
  <section class="card">
    <div class="card-head">
      <h2 class="card-title">量測</h2>
      <span class="card-note">Count</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-k">行數</div><div class="stat-v" id="s-line">0</div></div>
      <div class="stat"><div class="stat-k">段落</div><div class="stat-v" id="s-para">0</div></div>
      <div class="stat"><div class="stat-k">爆行</div><div class="stat-v" id="s-over">0</div></div>
      <div class="stat"><div class="stat-k">標籤</div><div class="stat-v" id="s-tag">0</div></div>
    </div>
    <div class="tags" id="tags"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 class="card-title">行寬圖</h2>
      <span class="card-note">Line Map</span>
    </div>
    <div class="map-wrap">
      <div class="map" id="map"><p class="map-empty">開始打字，這裡會畫出每一行。點一下可以跳到那行。</p></div>
      <div class="map-limit" id="map-limit" hidden></div>
    </div>
    <div class="map-legend" id="legend">
      <span class="dot"></span><span>紅線右側代表這行會被折下去。</span>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 class="card-title">送出</h2>
      <span class="card-note">Export</span>
    </div>
    <label class="opt">
      <input type="checkbox" id="opt-zwsp" checked>
      <span class="opt-t">
        <b>保留空行</b>
        Threads 會吃掉連續空行。開啟後複製時夾帶隱形字元，貼過去排版不變。
      </span>
    </label>
    <button class="link-btn" id="btn-clear" type="button">清空全部</button>
  </section>

  <p class="foot">375 PX · 19 CHARS · PROOF SHEET</p>
</div>

<!-- ===== 底部工具列 ===== -->
<div class="dock">
  <span class="dock-count" id="dock-count"><b>0</b> / 500</span>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <button class="icon-btn" id="btn-img" type="button" aria-label="加入圖片">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1C1E1B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 15.5l-5-4.5-9 8.5"/></svg>
  </button>
  <button class="dock-copy" id="btn-copy" type="button">複製貼文</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="toast-txt" id="toast-txt"></span>
  <button class="toast-undo" id="toast-undo" type="button">復原</button>
</div>

<script>
'use strict';

var MAX_CHARS = 500, MAX_IMG = 10, LINE_W = 19, MAP_MAX = 21, ZWSP = '\u200B';

var AVATAR_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">' +
  '<rect width="36" height="36" fill="#E4E6EB"/>' +
  '<circle cx="18" cy="14" r="6" fill="#B0B3B8"/>' +
  '<path d="M6 34c0-6.6 5.4-10 12-10s12 3.4 12 10z" fill="#B0B3B8"/></svg>');

var $ = function(id){ return document.getElementById(id); };
var composer = $('composer');
var images = [], snapshot = null, toastTimer = null, pending = false;

/* ============================================================
   字寬：全形 1 位、半形 0.5 位
   ============================================================ */
var WIDE = [[0x1100,0x115F],[0x2E80,0x303E],[0x3041,0x33FF],[0x3400,0x4DBF],
            [0x4E00,0x9FFF],[0xA000,0xA4CF],[0xAC00,0xD7A3],[0xF900,0xFAFF],
            [0xFE10,0xFE19],[0xFE30,0xFE6F],[0xFF00,0xFF60],[0xFFE0,0xFFE6],
            [0x2600,0x27BF],[0x1F300,0x1FAFF],[0x20000,0x3FFFD]];

function wide(cp){
  for (var i=0;i<WIDE.length;i++) if (cp>=WIDE[i][0] && cp<=WIDE[i][1]) return true;
  return false;
}
function width(str){
  var w = 0;
  for (var ch of str){
    var cp = ch.codePointAt(0);
    if (cp===0x200B || cp===0xFE0F || cp===0x200D) continue;
    w += wide(cp) ? 1 : 0.5;
  }
  return w;
}

var seg = (window.Intl && Intl.Segmenter)
  ? new Intl.Segmenter('zh-Hant',{granularity:'grapheme'}) : null;

function countChars(s){
  if (!s) return 0;
  if (seg){ var n=0; for (var _ of seg.segment(s)) n++; return n; }
  return Array.from(s).length;
}

/* ============================================================
   輸入：長高必須同步做，統計丟到下一幀
   ============================================================ */
function grow(){
  composer.style.height = '0px';
  composer.style.height = composer.scrollHeight + 'px';
}

function onInput(){
  grow();                        // 同步：不做的話文字會被蓋住
  if (pending) return;
  pending = true;
  requestAnimationFrame(function(){ pending = false; render(); });
}

/* ============================================================
   渲染
   ============================================================ */
function render(){
  var text = composer.value;
  var chars = countChars(text);
  var over = chars > MAX_CHARS;

  var dc = $('dock-count');
  dc.innerHTML = '<b>' + chars + '</b> / ' + MAX_CHARS;
  dc.classList.toggle('over', over);

  var lines = text.length === 0 ? [] : text.split(/\r\n|\r|\n/);
  var widths = lines.map(width);
  var overLines = widths.filter(function(w){ return w > LINE_W; }).length;

  $('s-line').textContent = lines.length;
  $('s-para').textContent = lines.filter(function(l){ return l.trim() !== ''; }).length;
  $('s-tag').textContent = (text.match(/#[\w\u4E00-\u9FFF\u3400-\u4DBF]+/g) || []).length;

  var so = $('s-over');
  so.textContent = overLines;
  so.classList.toggle('hot', overLines > 0);

  renderTags(text);
  renderMap(lines, widths, overLines);
}

function renderTags(text){
  var tags = text.match(/#[\w\u4E00-\u9FFF\u3400-\u4DBF]+/g) || [];
  var uniq = [], frag = document.createDocumentFragment();
  tags.forEach(function(t){ if (uniq.indexOf(t) < 0) uniq.push(t); });
  uniq.slice(0,12).forEach(function(t){
    var s = document.createElement('span');
    s.className = 'tag'; s.textContent = t;
    frag.appendChild(s);
  });
  $('tags').replaceChildren(frag);
}

function renderMap(lines, widths, overLines){
  var map = $('map'), limit = $('map-limit');

  if (lines.length === 0){
    var p = document.createElement('p');
    p.className = 'map-empty';
    p.textContent = '開始打字，這裡會畫出每一行。點一下可以跳到那行。';
    map.replaceChildren(p);
    limit.hidden = true;
    $('legend').classList.remove('on');
    return;
  }

  limit.hidden = false;
  var frag = document.createDocumentFragment(), offset = 0;

  lines.forEach(function(line, i){
    var w = widths[i], isOver = w > LINE_W;
    var start = offset;
    offset += line.length + 1;

    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'row';
    row.setAttribute('aria-label', '跳到第 ' + (i+1) + ' 行，' + w + ' 全形位');
    row.addEventListener('click', jumpTo.bind(null, start, start + line.length));

    var n = document.createElement('span');
    n.className = 'row-n'; n.textContent = i + 1;

    var track = document.createElement('span');
    track.className = 'track';

    var bar = document.createElement('span');
    bar.className = 'bar' + (isOver ? ' over' : '') + (w === 0 ? ' blank' : '');
    bar.style.width = Math.min(w / MAP_MAX, 1) * 100 + '%';

    track.appendChild(bar);
    row.appendChild(n); row.appendChild(track);
    frag.appendChild(row);
  });

  map.replaceChildren(frag);
  $('legend').classList.toggle('on', overLines > 0);
}

function jumpTo(start, end){
  composer.focus();
  try { composer.setSelectionRange(start, end); } catch (e) {}
}

/* ============================================================
   圖片
   ============================================================ */
function addFiles(list){
  var picked = Array.prototype.filter.call(list, function(f){
    return f.type.indexOf('image/') === 0;
  });
  if (!picked.length) return;

  var room = MAX_IMG - images.length;
  picked.slice(0, room).forEach(function(f){
    images.push({ url: URL.createObjectURL(f), name: f.name });
  });
  renderMedia();

  if (picked.length > room){
    toast(room === 0
      ? '已經有 ' + MAX_IMG + ' 張了，先移除幾張再加。'
      : '上限 ' + MAX_IMG + ' 張，這次加了 ' + room + ' 張。');
  }
}

function renderMedia(){
  var frag = document.createDocumentFragment();
  images.forEach(function(img, i){
    var item = document.createElement('div');
    item.className = 'media-item';

    var pic = document.createElement('img');
    pic.src = img.url; pic.alt = img.name || '已加入的圖片';

    var x = document.createElement('button');
    x.type = 'button'; x.className = 'media-x';
    x.innerHTML = '&times;';
    x.setAttribute('aria-label', '移除第 ' + (i+1) + ' 張圖片');
    x.addEventListener('click', removeImage.bind(null, i));

    item.appendChild(pic); item.appendChild(x);
    frag.appendChild(item);
  });
  $('media').replaceChildren(frag);
}

function removeImage(i){
  URL.revokeObjectURL(images[i].url);
  images.splice(i, 1);
  renderMedia();
}

/* ============================================================
   複製 / 清空
   ============================================================ */
function copyPost(){
  var raw = composer.value;
  if (raw.trim() === ''){ toast('還沒有內容可以複製。'); composer.focus(); return; }

  var out = raw.replace(/\r\n/g, '\n');
  if ($('opt-zwsp').checked) out = out.replace(/\n/g, '\n' + ZWSP);

  var done = function(){ toast($('opt-zwsp').checked ? '已複製，空行保留。' : '已複製。'); };

  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(out).then(done, function(){ legacy(out, done); });
  } else {
    legacy(out, done);
  }
}

function legacy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  ok ? done() : toast('複製沒成功，請長按輸入框手動選取。');
}

function clearAll(){
  if (composer.value === '' && images.length === 0) return;
  snapshot = { text: composer.value, images: images.slice() };
  composer.value = '';
  images = [];
  renderMedia(); grow(); render();
  toast('已清空。', true);
}

function undo(){
  if (!snapshot) return;
  composer.value = snapshot.text;
  images = snapshot.images;
  snapshot = null;
  renderMedia(); grow(); render();
  hideToast();
}

/* ============================================================
   通知
   ============================================================ */
function toast(msg, undoable){
  clearTimeout(toastTimer);
  $('toast-txt').textContent = msg;
  $('toast-undo').classList.toggle('on', !!undoable);
  $('toast').classList.add('on');
  toastTimer = setTimeout(hideToast, undoable ? 6000 : 2600);
}
function hideToast(){
  clearTimeout(toastTimer);
  $('toast').classList.remove('on');
}

/* ============================================================
   鍵盤開啟時把工具列頂上來
   ============================================================ */
function followKeyboard(){
  var vv = window.visualViewport;
  if (!vv) return;
  var gap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty('--safe-b',
    gap > 0 ? gap + 'px' : 'env(safe-area-inset-bottom, 0px)');
}

/* ============================================================
   啟動
   ============================================================ */
(function init(){
  var av = $('avatar');
  av.addEventListener('error', function(){ this.src = AVATAR_FALLBACK; });
  if (av.complete && av.naturalWidth === 0) av.src = AVATAR_FALLBACK;

  composer.addEventListener('input', onInput);

  $('btn-copy').addEventListener('click', copyPost);
  $('btn-clear').addEventListener('click', clearAll);
  $('toast-undo').addEventListener('click', undo);
  $('btn-img').addEventListener('click', function(){ $('file').click(); });
  $('file').addEventListener('change', function(e){
    addFiles(e.target.files); e.target.value = '';
  });
  $('opt-zwsp').addEventListener('change', function(){
    toast(this.checked ? '複製時會保留空行。' : '複製時使用原始換行。');
  });

  document.addEventListener('paste', function(e){
    if (e.clipboardData && e.clipboardData.files.length){
      e.preventDefault();
      addFiles(e.clipboardData.files);
    }
  });

  document.addEventListener('keydown', function(e){
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); copyPost(); }
  });

  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', followKeyboard);
    window.visualViewport.addEventListener('scroll', followKeyboard);
  }

  grow();
  render();
})();
</script>
